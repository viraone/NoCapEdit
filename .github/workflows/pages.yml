name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      # Served from the root of the custom domain (https://nocapedit.com), so no
      # base path. Set NEXT_PUBLIC_BASE_PATH=/<repo> only for a project sub-path site.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Browser smoke test of the on-device ML and editor fixes (QA audit 2026-09-24):
  # sticker background removal and subject cut-out (WASM fallback on CI),
  # LUT grading, split hotkeys, drag reordering, double-click editing and the
  # console/static-file checks. Reports separately and does not gate the deploy.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node e2e/qa.mjs --only=pages,lut,keys,dnd,dblclick,matte --gpu=off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: e2e/results
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
