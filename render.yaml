# Render Blueprint: hosts the YouTube helper (server/youtube/) so visitors to
# nocapedit.com can paste links without running anything themselves.
# Deploy: https://render.com/deploy?repo=https://github.com/viraone/NoCapEdit
# Afterwards set the GitHub repository variable YOUTUBE_SERVICE_URL to the
# service's https address and re-run the Pages deploy (see server/youtube/README.md).
services:
  - type: web
    name: nocap-youtube
    runtime: docker
    plan: free
    dockerfilePath: ./server/youtube/Dockerfile
    dockerContext: ./server/youtube
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Only a change inside the helper's own folder rebuilds it. Without this, every push
    # to main (even one that only touches the website) rebuilt the image, and the helper
    # was unreachable for a few minutes each time: visitors saw "the helper didn't answer".
    buildFilter:
      paths:
        - server/youtube/**
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_ORIGIN
        value: https://nocapedit.com
      - key: MAX_MINUTES
        value: "180"
      - key: MAX_JOBS
        value: "2"
